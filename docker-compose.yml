services:
  mongodb:
    image: mongo:7
    container_name: kasper-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: kasper_dev_password
    volumes:
      - mongo_data:/data/db

  localstack:
    image: localstack/localstack:4.14 # آخر نسخة من غير auth. لو عاوز latest: فك التعليق اللي تحت
    container_name: kasper-localstack
    restart: unless-stopped
    ports:
      - "4567:4566"
    environment:
      SERVICES: s3
      # LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d

volumes:
  mongo_data: